version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: fnb_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fnb_saas
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  fnb_app:
    build: .
    container_name: fnb_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=fnb_saas
    depends_on:
      - mysql

volumes:
  mysql_data:
